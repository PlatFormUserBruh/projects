<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Switch Board</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 550px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f5f6;
      color: #333;
      position: relative;
    }

    #settingsTrigger {
      position: fixed;
      top: 8px;
      left: 8px;
      font-size: 11px;
      cursor: pointer;
      opacity: 0.3;
      user-select: none;
      z-index: 1000;
      transition: opacity 0.2s;
    }

    #settingsTrigger:hover {
      opacity: 1;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #111;
      font-size: 1.4rem;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .edit-control {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .edit-control label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: flex-end;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      white-space: nowrap;
    }

    button:hover {
      background: #0056b3;
    }

    .switch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .switch-item:last-child {
      border-bottom: none;
    }

    .switch-label {
      font-size: 1.1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .delete-btn {
      color: #ff4d4d;
      background: none;
      border: none;
      padding: 0 5px;
      cursor: pointer;
      font-size: 1.2rem;
      display: none;
    }

    .delete-btn:hover {
      color: #cc0000;
    }

    .admin-mode .delete-btn {
      display: inline-block;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #28a745;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .share-box {
      background: #e9ecef;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      word-break: break-all;
      margin-top: 15px;
      border: 1px solid #ddd;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="settingsTrigger" onclick="toggleSettingsMode()">⚙️</div>

  <div class="card hidden" id="setupCard">
    <h2>🛠️ Settings Dashboard</h2>

    <div class="edit-grid">
      <div class="edit-control">
        <label for="boardNameInput">Switch Board Name</label>
        <input type="text" id="boardNameInput" placeholder="My Awesome Board" oninput="updateBoardName()" />
      </div>

      <div class="edit-control" style="align-items: flex-start;">
        <label>Copy Link On Toggle</label>
        <label class="switch" style="margin-top: 5px;">
          <input type="checkbox" id="autoCopyToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="input-group">
      <div style="flex: 1;">
        <label style="font-size: 0.85rem; font-weight: bold; color: #666; text-transform: uppercase; display: block; margin-bottom: 5px;">
          New Switch Name
        </label>
        <input type="text" id="switchName" placeholder="Name your toggle..." />
      </div>
      <button onclick="addSwitch()" style="height: 40px;">Add</button>
    </div>
  </div>

  <div class="card hidden" id="boardCard">
    <h2 id="boardTitle">🎛️ Your Switch Board</h2>
    <div id="switchContainer"></div>

    <div id="shareSection" class="hidden" style="margin-top: 25px;">
      <div class="share-box" id="urlDisplay">URL updating...</div>
    </div>
  </div>

  <script>
    let switches = [];
    let urlPassword = '';
    let boardName = 'Your Switch Board';
    let isAdminAuthenticated = false;

    function escapeHtml(str = '') {
      return str.replace(/[&<>"']/g, function (char) {
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return map[char];
      });
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      const dataParam = params.get('s');
      const nameParam = params.get('n');
      urlPassword = params.get('p') || '';

      if (nameParam) {
        boardName = decodeURIComponent(nameParam);
      }

      document.getElementById('boardNameInput').value = nameParam ? boardName : '';
      updateBoardNameDisplay();

      if (dataParam) {
        try {
          switches = dataParam.split(',').map(item => {
            const [name, state] = item.split(':');
            if (!name) return null;
            return {
              name: decodeURIComponent(name),
              state: state === '1'
            };
          }).filter(Boolean);
          render();
        } catch (e) {
          console.error("Error parsing URL parameters", e);
        }
      } else {
        render();
      }
    }

    function updateBoardName() {
      const input = document.getElementById('boardNameInput');
      boardName = input.value.trim() || 'Your Switch Board';
      updateBoardNameDisplay();
      updateURL();
    }

    function updateBoardNameDisplay() {
      document.getElementById('boardTitle').innerText = `🎛️ ${boardName}`;
    }

    function updateURL() {
      const defaultBoardName = 'Your Switch Board';

      if (switches.length === 0 && boardName === defaultBoardName) {
        const passString = urlPassword ? `?p=${encodeURIComponent(urlPassword)}` : '';
        window.history.replaceState({}, '', window.location.pathname + passString);
        document.getElementById('boardCard').classList.add('hidden');
        return '';
      }

      document.getElementById('boardCard').classList.remove('hidden');

      const queryParams = [];

      if (switches.length > 0) {
        const dataString = switches
          .map(s => `${encodeURIComponent(s.name)}:${s.state ? '1' : '0'}`)
          .join(',');
        queryParams.push(`s=${dataString}`);
      }

      if (boardName !== defaultBoardName && boardName.trim() !== '') {
        queryParams.push(`n=${encodeURIComponent(boardName)}`);
      }

      if (urlPassword) {
        queryParams.push(`p=${encodeURIComponent(urlPassword)}`);
      }

      const newUrl = queryParams.length > 0
        ? `${window.location.origin}${window.location.pathname}?${queryParams.join('&')}`
        : `${window.location.origin}${window.location.pathname}`;

      window.history.replaceState({}, '', newUrl);
      document.getElementById('urlDisplay').innerText = newUrl;

      return newUrl;
    }

    function toggleSettingsMode() {
      if (isAdminAuthenticated) {
        isAdminAuthenticated = false;
        document.getElementById('setupCard').classList.add('hidden');
        document.getElementById('shareSection').classList.add('hidden');
        document.body.classList.remove('admin-mode');
        return;
      }

      const inputPass = prompt("Enter password to modify settings:");

      if (inputPass === urlPassword) {
        isAdminAuthenticated = true;
        document.getElementById('setupCard').classList.remove('hidden');
        document.getElementById('shareSection').classList.remove('hidden');
        document.body.classList.add('admin-mode');
      } else {
        alert("Incorrect password or no password set in URL.");
      }
    }

    function addSwitch() {
      const input = document.getElementById('switchName');
      const name = input.value.trim();

      if (name) {
        switches.push({ name, state: false });
        input.value = '';
        render();
      }
    }

    function toggleSwitch(index) {
      switches[index].state = !switches[index].state;
      const updatedUrl = updateURL();

      if (document.getElementById('autoCopyToggle').checked && updatedUrl) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(updatedUrl).catch(err => {
            console.error('Could not auto-copy text: ', err);
          });
        }
      }
    }

    function deleteSwitch(index) {
      switches.splice(index, 1);
      render();
    }

    function render() {
      const container = document.getElementById('switchContainer');
      container.innerHTML = '';

      if (switches.length === 0) {
        document.getElementById('boardCard').classList.add('hidden');
        updateURL();
        return;
      }

      document.getElementById('boardCard').classList.remove('hidden');

      switches.forEach((s, index) => {
        const item = document.createElement('div');
        item.className = 'switch-item';
        item.innerHTML = `
          <div class="switch-label">
            <button class="delete-btn" type="button" aria-label="Delete switch" onclick="deleteSwitch(${index})">×</button>
            <span>${escapeHtml(s.name)}</span>
          </div>

          <label class="switch">
            <input type="checkbox" ${s.state ? 'checked' : ''} onchange="toggleSwitch(${index})">
            <span class="slider"></span>
          </label>
        `;
        container.appendChild(item);
      });

      updateURL();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
